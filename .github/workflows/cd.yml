name: CD - Mottu Smart Ops Continuous Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: cd-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Continuous Deployment to Cloud VM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Evaluate Deployment Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ] && [ -n "${{ secrets.SSH_USER }}" ] && [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "✅ Deployment credentials present. Proceeding with automated deployment."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Notice: SSH deployment secrets (SSH_HOST, SSH_USER, SSH_PRIVATE_KEY) not configured in GitHub Secrets."
            echo "ℹ️ Skipping automated remote deployment gracefully without breaking the pipeline."
          fi

      - name: Deploy to Remote VM via SSH
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Normalização e autorreparo inteligente da chave privada SSH (suporta base64 puro ou com headers)
          python3 -c "
          import os
          key = os.environ.get('SSH_KEY', '').strip().replace(chr(13), '')
          if '\\\\n' in key and chr(10) not in key:
              key = key.replace('\\\\n', chr(10))
          if not key.startswith('-----BEGIN'):
              key = '-----BEGIN RSA PRIVATE KEY-----\n' + key + '\n-----END RSA PRIVATE KEY-----'
          with open(os.path.expanduser('~/.ssh/id_rsa'), 'w') as f:
              f.write(key + chr(10))
          "
          chmod 600 ~/.ssh/id_rsa

          # Valida o formato da chave privada
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub 2>&1 || {
            echo "❌ Erro ao validar a chave privada com ssh-keygen:"
            cat ~/.ssh/id_rsa.pub || true
            exit 1
          }

          echo "✅ Chave SSH validada com sucesso! Fingerprint público:"
          ssh-keygen -l -f ~/.ssh/id_rsa

          echo "🚀 Conectando via SSH à VM ($SSH_USER@$SSH_HOST:$SSH_PORT)..."
          set +e
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash << 'EOF' > /tmp/deploy.log 2>&1
            set -ex
            trap 'echo "❌ FALHA NO DEPLOY NA LINHA $LINENO"; docker compose -f infra/docker-compose.prod.yml logs --tail=100 || true; docker compose -f infra/docker-compose.prod.yml ps -a || true' ERR

            echo "🚀 Atualizando repositório na VM..."
            cd /home/ubuntu/mottu-smart-ops || cd ~/mottu-smart-ops
            git fetch origin main
            git reset --hard origin/main
            if grep -q "^S3_PUBLIC_ENDPOINT=" .env 2>/dev/null; then
              sed -i 's|^S3_PUBLIC_ENDPOINT=.*|S3_PUBLIC_ENDPOINT=http://161.153.2.148:18088|' .env
            else
              echo "S3_PUBLIC_ENDPOINT=http://161.153.2.148:18088" >> .env
            fi
            rm -f infra/.env
            cp -f .env infra/.env

            echo "🚀 Fazendo build e reiniciando containers via Docker Compose..."
            docker compose -f infra/docker-compose.prod.yml build
            docker compose -f infra/docker-compose.prod.yml up -d --remove-orphans

            echo "⏳ Aguardando inicialização dos serviços (25s)..."
            sleep 25
            docker compose -f infra/docker-compose.prod.yml ps
            docker compose -f infra/docker-compose.prod.yml logs --tail=30
            echo "✅ Mottu Smart Ops atualizado e operando com sucesso!"
          EOF
          DEPLOY_EXIT=$?
          set -e

          echo "==================== DEPLOY OUTPUT ===================="
          cat /tmp/deploy.log
          echo "======================================================="

          echo "### 🚀 Mottu Smart Ops Deploy Execution Log" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 /tmp/deploy.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Publica o log do deploy como commit comment acessível publicamente via API
          python3 -c "
          import urllib.request, json, os
          token = os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')
          sha = os.environ.get('GITHUB_SHA')
          if token and repo and sha and os.path.exists('/tmp/deploy.log'):
              with open('/tmp/deploy.log', 'r', errors='ignore') as f:
                  log_content = f.read()[-3000:]
              url = f'https://api.github.com/repos/{repo}/commits/{sha}/comments'
              req = urllib.request.Request(
                  url,
                  data=json.dumps({'body': f'### 🚀 Mottu Smart Ops Deploy Log\n\`\`\`text\n{log_content}\n\`\`\`'}).encode(),
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'Actions'}
              )
              try:
                  urllib.request.urlopen(req)
                  print('✅ Log postado nos comentários do commit com sucesso!')
              except Exception as e:
                  print('Aviso ao postar comentário de commit:', e)
          " || true

          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            echo "❌ Deployment command exited with status $DEPLOY_EXIT"
            exit $DEPLOY_EXIT
          fi

      - name: Upload Deployment Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs
          path: /tmp/deploy.log

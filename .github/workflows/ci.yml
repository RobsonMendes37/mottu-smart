name: CI - Mottu Smart Ops Quality Gates

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-api-ci:
    name: Java Core API (TDD & Hexagonal Purity)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x apps/core-api/mvnw

      - name: Build, Test and Verify Domain Coverage (100%)
        working-directory: apps/core-api
        run: ./mvnw clean verify -B

  intelligence-ci:
    name: Python Intelligence Service (CRAG, Linter & AST Purity)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: apps/intelligence-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff Linter and Mypy Typecheck
        working-directory: apps/intelligence-service
        run: |
          ruff check app/
          mypy app/domain --ignore-missing-imports

      - name: Run Pytest Suite with 100% Domain Coverage & Hexagonal Purity
        working-directory: apps/intelligence-service
        env:
          GEMINI_MOCK_MODE: "true"
          BIGQUERY_ENABLED: "false"
        run: |
          pytest tests/ -v
          pytest tests/unit/ --cov=app/domain --cov-fail-under=100
          pytest tests/test_domain_purity.py -v

  web-app-ci:
    name: Angular 19 Web App (Vitest, Lint & Production Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web-app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web-app
        run: npm ci

      - name: Typecheck and Lint
        working-directory: apps/web-app
        run: npm run lint

      - name: Run Angular Vitest Suite
        working-directory: apps/web-app
        run: npm run test:ci

      - name: Build Production Bundle
        working-directory: apps/web-app
        run: npm run build

      - name: Verify Strict Purple Ban (Zero Violet/Purple/Indigo)
        run: |
          echo "Scanning apps/web-app/src for forbidden purple/violet/indigo CSS..."
          MATCHES=$(grep -rnEi "(text|bg|border)-(purple|violet|indigo)" apps/web-app/src || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: Purple Ban violation detected in frontend code:"
            echo "$MATCHES"
            exit 1
          fi
          echo "Strict Purple Ban verified: zero purple classes in apps/web-app/src."

  security-and-ux-audit:
    name: Security & UX Quality Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run AG Kit Security Vulnerability Scanner
        run: python3 .agents/skills/vulnerability-scanner/scripts/security_scan.py . --fail-on critical

      - name: Run UX Design & Solar Readability Audit
        run: python3 .agents/skills/frontend-design/scripts/ux_audit.py .

  sca-dependency-audit:
    name: Software Composition Analysis (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit Production Frontend Dependencies
        working-directory: apps/web-app
        run: |
          echo "Auditing production npm dependencies..."
          npm audit --omit=dev --audit-level=critical || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python Dependencies
        working-directory: apps/intelligence-service
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt || true

  sonarcloud-sast:
    name: SonarCloud SAST Analysis
    runs-on: ubuntu-latest
    needs: [core-api-ci, intelligence-ci, web-app-ci]
    if: always() && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate SonarCloud Token
        id: check_sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "SonarCloud token present in GitHub Secrets. Proceeding with analysis."
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "Notice: SONAR_TOKEN secret is not yet configured in GitHub repository settings."
            echo "Skipping SonarCloud remote scan gracefully without breaking the build (Autonomous Mode)."
          fi

      - name: SonarCloud Scan
        if: steps.check_sonar.outputs.has_token == 'true'
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

name: CD - Mottu Smart Ops Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Continuous Deployment to Cloud VM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Evaluate Deployment Credentials
        id: check_creds
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ] && [ -n "${{ secrets.SSH_USER }}" ] && [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "✅ Deployment credentials present. Proceeding with automated deployment."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Notice: SSH deployment secrets (SSH_HOST, SSH_USER, SSH_PRIVATE_KEY) not configured in GitHub Secrets."
            echo "ℹ️ Skipping automated remote deployment gracefully without breaking the pipeline."
          fi

      - name: Deploy to Remote VM via SSH
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python3 -c "
          import os
          k = os.environ.get('SSH_KEY', '').strip()
          print('--- Diagnóstico Seguro de SSH_PRIVATE_KEY ---')
          print('Tamanho (caracteres):', len(k))
          print('Quantidade de linhas:', len(k.splitlines()))
          print('Começa com:', k[:20] if len(k) >= 20 else k)
          print('Termina com:', k[-20:] if len(k) >= 20 else k)
          print('Contém \"PRIVATE KEY\":', 'PRIVATE KEY' in k)
          print('Contém \"ssh-rsa\":', 'ssh-rsa' in k)
          print('Parece caminho de arquivo:', k.startswith('/') or k.startswith('C:'))
          print('-------------------------------------------')
          "

          # Garante parsing robusto da chave privada (normalizando Unix, Windows e literais \n)
          python3 -c "import os; key = os.environ.get('SSH_KEY', '').strip().replace(chr(13), ''); key = key.replace('\\\\n', chr(10)) if chr(10) not in key else key; open(os.path.expanduser('~/.ssh/id_rsa'), 'w').write(key + chr(10))"
          chmod 600 ~/.ssh/id_rsa

          # Valida o formato da chave privada
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub 2>&1 || {
            echo "❌ Erro do ssh-keygen:"
            cat ~/.ssh/id_rsa.pub || true
            exit 1
          }

          echo "🚀 Conectando via SSH à VM ($SSH_USER@$SSH_HOST:$SSH_PORT)..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash << 'EOF'
            set -e
            echo "🚀 Atualizando repositório na VM..."
            cd /home/ubuntu/mottu-smart-ops || cd ~/mottu-smart-ops
            git fetch origin main
            git reset --hard origin/main
            ln -sf .env infra/.env 2>/dev/null || true
            echo "🚀 Fazendo build e reiniciando containers via Docker Compose..."
            docker compose -f infra/docker-compose.prod.yml build
            docker compose -f infra/docker-compose.prod.yml up -d --remove-orphans
            echo "⏳ Aguardando healthchecks..."
            sleep 10
            docker compose -f infra/docker-compose.prod.yml ps
            echo "✅ Mottu Smart Ops atualizado e operando com sucesso!"
          EOF

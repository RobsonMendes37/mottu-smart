# SonarCloud / SonarQube Project Configuration
# Documentation: https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-parameters/

sonar.projectKey=RobsonMendes37_mottu-smart
sonar.organization=robsonmendes37
sonar.projectName=Mottu Smart Ops

# Encoding
sonar.sourceEncoding=UTF-8

# Source Code Paths
sonar.sources=apps/core-api/src/main/java,apps/intelligence-service/app,apps/web-app/src

# Test Code Paths
sonar.tests=apps/core-api/src/test/java,apps/intelligence-service/tests,apps/web-app/src
sonar.test.inclusions=**/*Test.java,**/test_*.py,**/*.spec.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/target/**,**/.venv/**,**/dist/**,**/*.spec.ts,**/*Test.java,**/htmlcov/**,**/e2e/**

# Coverage Reports Integration
sonar.coverage.jacoco.xmlReportPaths=apps/core-api/target/site/jacoco/jacoco.xml
sonar.python.coverage.reportPaths=apps/intelligence-service/coverage.xml
sonar.javascript.lcov.reportPaths=apps/web-app/coverage/lcov.info

# Java Binaries (Required for Java Bytecode Analysis)
sonar.java.binaries=apps/core-api/target/classes
sonar.java.libraries=apps/core-api/target/dependency/*.jar

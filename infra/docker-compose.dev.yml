name: mottu-smart-ops-dev

networks:
  mottu-net:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
  caddy_dev_data:
  caddy_dev_config:

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mottu-postgres-dev
    restart: unless-stopped
    ports:
      - "${HOST_PORT_POSTGRES:-15432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mottu_ops}
      POSTGRES_USER: ${POSTGRES_USER:-mottu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mottu_dev_pass}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mottu} -d $${POSTGRES_DB:-mottu_ops}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mottu-net

  redis:
    image: redis:7-alpine
    container_name: mottu-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${HOST_PORT_REDIS:-16379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - mottu-net

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: mottu-minio-dev
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${HOST_PORT_MINIO_API:-19000}:9000"
      - "${HOST_PORT_MINIO_CONSOLE:-19001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - mottu-net

  minio-create-buckets:
    image: cgr.dev/chainguard/minio:latest
    container_name: mottu-minio-create-buckets-dev
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./mock-photos:/mock-photos:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set myminio http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin123}
        mc mb --ignore-existing myminio/$${S3_BUCKET_NAME:-mottu-inspections}
        mc anonymous set download myminio/$${S3_BUCKET_NAME:-mottu-inspections}
        if [ -d /mock-photos ]; then
          mc cp /mock-photos/avaria-retrovisor.webp myminio/$${S3_BUCKET_NAME:-mottu-inspections}/inspections/sample-retrovisor.webp || true
          mc cp /mock-photos/avaria-retrovisor.webp myminio/$${S3_BUCKET_NAME:-mottu-inspections}/inspections/2026/11/633cc57e-cad2-4d7b-9d9a-0eebd8fa771a.webp || true
          mc cp /mock-photos/avaria-manete.webp myminio/$${S3_BUCKET_NAME:-mottu-inspections}/inspections/sample-manete.webp || true
          mc cp /mock-photos/avaria-pneu.webp myminio/$${S3_BUCKET_NAME:-mottu-inspections}/inspections/sample-pneu.webp || true
          mc cp /mock-photos/avaria-farol.webp myminio/$${S3_BUCKET_NAME:-mottu-inspections}/inspections/sample-farol.webp || true
          mc cp /mock-photos/avaria-escapamento.webp myminio/$${S3_BUCKET_NAME:-mottu-inspections}/inspections/sample-escapamento.webp || true
          mc cp /mock-photos/avaria-painel.webp myminio/$${S3_BUCKET_NAME:-mottu-inspections}/inspections/sample-painel.webp || true
          # Baseline 360 photos for Expedição & Estado Zero
          mc cp /mock-photos/avaria-farol.jpg myminio/$${S3_BUCKET_NAME:-mottu-inspections}/baseline_front_mottu_sport.jpg || true
          mc cp /mock-photos/avaria-pneu.jpg myminio/$${S3_BUCKET_NAME:-mottu-inspections}/baseline_rear_mottu_sport.jpg || true
          mc cp /mock-photos/avaria-retrovisor.jpg myminio/$${S3_BUCKET_NAME:-mottu-inspections}/baseline_right_mottu_sport.jpg || true
          mc cp /mock-photos/avaria-escapamento.jpg myminio/$${S3_BUCKET_NAME:-mottu-inspections}/baseline_left_mottu_sport.jpg || true
          mc cp /mock-photos/avaria-painel.jpg myminio/$${S3_BUCKET_NAME:-mottu-inspections}/baseline_odometer_10000.jpg || true
          # Legacy realistic seed names
          mc cp /mock-photos/avaria-farol.jpg myminio/$${S3_BUCKET_NAME:-mottu-inspections}/farol_dianteiro_trincado_inspecao_png_1794260378880.jpg || true
          mc cp /mock-photos/avaria-manete.jpg myminio/$${S3_BUCKET_NAME:-mottu-inspections}/moto_guidao_danificado_1794260367908.jpg || true
          mc cp /mock-photos/avaria-pneu.jpg myminio/$${S3_BUCKET_NAME:-mottu-inspections}/pneu_traseiro_moto_careca_closeup_1794260393447.jpg || true
          mc cp /mock-photos/avaria-escapamento.jpg myminio/$${S3_BUCKET_NAME:-mottu-inspections}/mottu_damage_exhaust_scratches_1794260407150.jpg || true
        fi
        exit 0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-mottu-inspections}
    restart: "no"
    networks:
      - mottu-net

  caddy:
    image: caddy:2-alpine
    container_name: mottu-caddy-dev
    restart: unless-stopped
    ports:
      - "${HOST_PORT_CADDY:-18088}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dev_data:/data
      - caddy_dev_config:/config
    networks:
      - mottu-net
